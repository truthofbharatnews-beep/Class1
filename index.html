
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FriendZone - Welcome</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;padding:35px 25px;border:1px solid #bd913e;border-radius:22px;background:#111;box-shadow:0 0 35px #a8782930;text-align:center}
.logo{font-size:38px;font-weight:bold;color:#e8c36e;text-shadow:0 0 20px #bd913e;letter-spacing:2px}
.tag{color:#aaa;margin:12px 0 35px}
h2{color:#f0d18c}
input{width:100%;padding:16px;margin:10px 0;background:#191919;color:white;border:1px solid #55472e;border-radius:10px;font-size:16px;outline:none}
button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.gold{background:linear-gradient(100deg,#a87926,#f4d58c,#b78a37);color:#17100a;box-shadow:0 0 18px #bd913e40}
.google{background:#252525;color:white;border:1px solid #555}
a,.switch{color:#e6bd62;cursor:pointer}
#message{color:#e6bd62;min-height:25px;margin-top:15px;font-size:14px}
.hidden{display:none}
footer{color:#666;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">✦ FRIENDZONE</div>
  <div class="tag">Connect. Share. Discover.</div>

  <section id="login">
    <h2>Welcome Back</h2>
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">
    <p style="text-align:right"><a id="forgot">Forgot password?</a></p>
    <button class="gold" id="loginBtn">Login</button>
    <button class="google" id="googleBtn">Continue with Google</button>
    <p class="switch" id="showRegister">Don't have an account? Create Account</p>
  </section>

  <section id="register" class="hidden">
    <h2>Create Account</h2>
    <input id="name" placeholder="Your full name" maxlength="40">
    <input id="regEmail" type="email" placeholder="Email address">
    <input id="regPassword" type="password" placeholder="Password (at least 6 characters)">
    <button class="gold" id="registerBtn">Create Account</button>
    <p class="switch" id="showLogin">Already have an account? Login</p>
  </section>

  <div id="message"></div>
  <footer>© 2026 FriendZone. All rights reserved.</footer>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
 getAuth,signInWithEmailAndPassword,
 createUserWithEmailAndPassword,sendPasswordResetEmail,
 GoogleAuthProvider,signInWithPopup,onAuthStateChanged,
 updateProfile
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
 getFirestore,doc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDjAZ_4eHN21jtWyq3mYv43uhw7yaGIuA0",
 authDomain:"class-f0376.firebaseapp.com",
 projectId:"class-f0376",
 storageBucket:"class-f0376.firebasestorage.app",
 messagingSenderId:"861064597115",
 appId:"1:861064597115:web:11eed88d44a05ea76c1cde",
 measurementId:"G-S46KERZ8Q5"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
const message=$("message");

function say(t){message.textContent=t}
function show(which){
 $("login").classList.toggle("hidden",which!=="login");
 $("register").classList.toggle("hidden",which!=="register");
 say("");
}

$("showRegister").onclick=()=>show("register");
$("showLogin").onclick=()=>show("login");

onAuthStateChanged(auth,user=>{
 if(user) location.replace("home.html");
});

async function saveUser(user,name=""){
 await setDoc(doc(db,"users",user.uid),{
  uid:user.uid,
  name:name || user.displayName || "FriendZone User",
  email:user.email || "",
  photo:user.photoURL || "",
  bio:"",
  updatedAt:serverTimestamp()
 },{merge:true});
}

$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;
 if(!email||!password)return say("Enter email and password.");
 try{
  say("Logging in...");
  await signInWithEmailAndPassword(auth,email,password);
  location.replace("home.html");
 }catch(e){say(e.message)}
};

$("registerBtn").onclick=async()=>{
 const name=$("name").value.trim();
 const email=$("regEmail").value.trim();
 const password=$("regPassword").value;

 if(!name||!email||password.length<6)
  return say("Enter your name, email and a password of at least 6 characters.");

 try{
  say("Creating your account...");
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(result.user,{displayName:name});
  await saveUser(result.user,name);
  location.replace("home.html");
 }catch(e){say(e.message)}
};

$("googleBtn").onclick=async()=>{
 try{
  say("Connecting to Google...");
  const result=await signInWithPopup(auth,new GoogleAuthProvider());
  await saveUser(result.user);
  location.replace("home.html");
 }catch(e){say(e.message)}
};

$("forgot").onclick=async()=>{
 const email=$("email").value.trim();
 if(!email)return say("Enter your email address first.");
 try{
  await sendPasswordResetEmail(auth,email);
  say("Password reset email sent. Check your inbox.");
 }catch(e){say(e.message)}
};
</script>
</body>
</html>
